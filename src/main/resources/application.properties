spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/appdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:appuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:apppassword}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8081

go.product-service.url=${GO_PRODUCT_SERVICE_URL:http://localhost:8084}
node.tutorial-service.url=${NODE_TUTORIAL_SERVICE_URL:http://localhost:9090}

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

spring.kafka.producer.properties.enable.idempotence=true

app.kafka.topic=app-events